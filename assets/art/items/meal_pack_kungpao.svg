<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- 料理包·宫保鸡丁（#53）：预制菜铝箔袋——正红袋身 + 花生点缀，贴纸描边 -->
<g stroke="#4A3728" stroke-width="4" stroke-linejoin="round">
  <!-- 袋身 -->
  <rect x="22" y="18" width="84" height="96" rx="10" fill="#D94F3D"/>
  <!-- 顶部压边 -->
  <rect x="22" y="18" width="84" height="14" rx="7" fill="#B03A2E"/>
  <path d="M30 25 L98 25" stroke="#8F2A1E" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- 标签 -->
  <rect x="36" y="46" width="56" height="48" rx="8" fill="#FFF6E5"/>
  <!-- 宫保：鸡丁块 + 花生 -->
  <rect x="46" y="56" width="16" height="14" rx="4" fill="#D94F3D" stroke-width="3"/>
  <rect x="64" y="64" width="14" height="13" rx="4" fill="#C94A38" stroke-width="3"/>
  <circle cx="76" cy="58" r="5" fill="#F2C14E" stroke-width="3"/>
  <circle cx="54" cy="80" r="4.5" fill="#F2C14E" stroke-width="3"/>
  <!-- 袋身高光 -->
  <path d="M30 40 Q34 90 30 106" fill="none" stroke="#FFF6E5" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
