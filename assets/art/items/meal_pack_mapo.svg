<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- 料理包·麻婆豆腐（#53）：预制菜铝箔袋——深红褐袋身 + 豆腐块，贴纸描边 -->
<g stroke="#4A3728" stroke-width="4" stroke-linejoin="round">
  <!-- 袋身 -->
  <rect x="22" y="18" width="84" height="96" rx="10" fill="#8F4A3A"/>
  <!-- 顶部压边 -->
  <rect x="22" y="18" width="84" height="14" rx="7" fill="#6E362A"/>
  <path d="M30 25 L98 25" stroke="#572A20" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- 标签 -->
  <rect x="36" y="46" width="56" height="48" rx="8" fill="#C0392B"/>
  <!-- 麻婆：白玉豆腐块 + 葱花 -->
  <rect x="46" y="56" width="16" height="14" rx="3" fill="#FFFBF0" stroke-width="3"/>
  <rect x="64" y="66" width="16" height="14" rx="3" fill="#FFF3E0" stroke-width="3"/>
  <circle cx="72" cy="58" r="2.8" fill="#6FCE96" stroke="none"/>
  <circle cx="54" cy="80" r="2.8" fill="#6FCE96" stroke="none"/>
  <circle cx="80" cy="78" r="2.8" fill="#6FCE96" stroke="none"/>
  <!-- 袋身高光 -->
  <path d="M30 40 Q34 90 30 106" fill="none" stroke="#FFF6E5" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
