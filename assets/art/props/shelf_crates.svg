<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
<!-- 冷库货架（#51）：俯视——金属框架 + 三层隔板 + 纸箱货物，贴纸描边 -->
<g stroke="#4A3728" stroke-width="4" stroke-linejoin="round">
  <!-- 立柱 -->
  <rect x="10" y="10" width="16" height="260" rx="6" fill="#8A94A6"/>
  <rect x="214" y="10" width="16" height="260" rx="6" fill="#8A94A6"/>
  <!-- 三层隔板 -->
  <rect x="20" y="20" width="200" height="70" rx="8" fill="#C6CEDA"/>
  <rect x="20" y="105" width="200" height="70" rx="8" fill="#C6CEDA"/>
  <rect x="20" y="190" width="200" height="70" rx="8" fill="#C6CEDA"/>
  <!-- 顶层：两个纸箱 -->
  <rect x="38" y="32" width="70" height="46" rx="6" fill="#DDB76E"/>
  <path d="M73 32 L73 78" stroke="#B8904F" stroke-width="4"/>
  <rect x="128" y="36" width="64" height="42" rx="6" fill="#DDB76E"/>
  <path d="M160 36 L160 78" stroke="#B8904F" stroke-width="4"/>
  <!-- 中层：纸箱 + 白盒 -->
  <rect x="40" y="118" width="76" height="46" rx="6" fill="#DDB76E"/>
  <path d="M78 118 L78 164" stroke="#B8904F" stroke-width="4"/>
  <rect x="136" y="122" width="58" height="40" rx="6" fill="#FFF6E5"/>
  <!-- 底层：三个小箱 -->
  <rect x="38" y="204" width="48" height="42" rx="6" fill="#DDB76E"/>
  <rect x="96" y="206" width="48" height="40" rx="6" fill="#DDB76E"/>
  <rect x="154" y="204" width="44" height="42" rx="6" fill="#FFF6E5"/>
</g>
</svg>
