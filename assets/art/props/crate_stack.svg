  <rect x="14" y="96" width="90" height="80" rx="8" fill="#DDB76E"/>
  <rect x="50" y="96" width="18" height="80" fill="#F2C14E" fill-opacity="0.8" stroke="#B8904F" stroke-width="3"/>
  <rect x="96" y="104" width="90" height="80" rx="8" fill="#DDB76E"/>
  <rect x="132" y="104" width="18" height="80" fill="#F2C14E" fill-opacity="0.8" stroke="#B8904F" stroke-width="3"/>
