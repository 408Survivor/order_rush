<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160">
<!-- 取餐台（#103）：220x160 出餐窗口台——木托盘 + 金色铃铛 + 奶油招牌，暖木色 + 深棕描边（风格对齐 #51/#85/#93 手绘路线） -->
<ellipse cx="110" cy="150" rx="96" ry="8" fill="#4A3728" fill-opacity="0.15"/>
<!-- 木托盘台面 -->
<rect x="16" y="108" width="188" height="34" rx="10" fill="#C68B59" stroke="#4A3728" stroke-width="6"/>
<rect x="24" y="112" width="172" height="8" rx="4" fill="#E2AC7A"/>
<!-- 托盘内衬（奶油白餐垫） -->
<rect x="34" y="96" width="152" height="22" rx="8" fill="#FFF6E5" stroke="#4A3728" stroke-width="5"/>
<!-- 金色铃铛（取餐铃） -->
<path d="M110 46 Q134 46 134 78 L136 84 L84 84 L86 78 Q86 46 110 46 Z" fill="#FFD98A" stroke="#4A3728" stroke-width="5" stroke-linejoin="round"/>
<circle cx="110" cy="42" r="8" fill="#FFD98A" stroke="#4A3728" stroke-width="5"/>
<rect x="80" y="82" width="60" height="9" rx="4" fill="#E8A558" stroke="#4A3728" stroke-width="4"/>
<path d="M96 56 Q100 50 108 50" fill="none" stroke="#FFF6E5" stroke-width="4" stroke-linecap="round"/>
<!-- 招牌小牌（挂台面前沿；thorvg 不渲染 <text>，改画餐盘图标） -->
<rect x="76" y="112" width="68" height="26" rx="7" fill="#FFF6E5" stroke="#4A3728" stroke-width="5"/>
<ellipse cx="110" cy="125" rx="16" ry="9" fill="#FFFFFF" stroke="#4A3728" stroke-width="4"/>
<ellipse cx="110" cy="125" rx="8" ry="4" fill="#FF8A80" stroke="#4A3728" stroke-width="3"/>
<!-- 两侧点缀：薄荷叶 -->
<circle cx="52" cy="100" r="6" fill="#8FD6A8" stroke="#4A3728" stroke-width="3"/>
<circle cx="168" cy="100" r="6" fill="#8FD6A8" stroke="#4A3728" stroke-width="3"/>
</svg>
