<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
<!-- 货箱（#51）：俯视纸箱——浅棕底（modulate 按菜品染色）+ 胶带十字 + 箱盖缝 -->
<g stroke="#4A3728" stroke-width="4" stroke-linejoin="round">
  <rect x="6" y="6" width="128" height="108" rx="8" fill="#DDB76E"/>
  <!-- 箱盖中缝与折痕 -->
  <path d="M70 6 L70 114" stroke="#B8904F" stroke-width="4"/>
  <path d="M6 30 L70 30 M70 30 L134 30" stroke="#C9A06A" stroke-width="3" fill="none"/>
  <!-- 胶带 -->
  <rect x="60" y="6" width="20" height="108" fill="#F2C14E" fill-opacity="0.85" stroke="#B8904F" stroke-width="3"/>
  <!-- 高光 -->
  <path d="M18 16 Q50 10 90 14" fill="none" stroke="#FFF6E5" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
