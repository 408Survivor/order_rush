<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
<!-- 顶墙段（#51）：奶油砖墙 + 木质护墙板，可水平平铺（480px 一段） -->
<g>
  <rect x="0" y="0" width="480" height="120" fill="#F7EBD5"/>
  <!-- 砖缝 -->
  <g stroke="#E8D5B5" stroke-width="3">
    <path d="M0 30 L480 30 M0 60 L480 60 M0 90 L480 90" fill="none"/>
    <path d="M60 0 L60 30 M180 0 L180 30 M300 0 L300 30 M420 0 L420 30" fill="none"/>
    <path d="M0 30 L0 60 M120 30 L120 60 M240 30 L240 60 M360 30 L360 60 M480 30 L480 60" fill="none"/>
    <path d="M60 60 L60 90 M180 60 L180 90 M300 60 L300 90 M420 60 L420 90" fill="none"/>
  </g>
  <!-- 护墙板 -->
  <rect x="0" y="96" width="480" height="24" fill="#B07D4E"/>
  <path d="M0 100 L480 100" stroke="#8F6510" stroke-width="3"/>
  <path d="M40 104 L40 120 M120 104 L120 120 M200 104 L200 120 M280 104 L280 120 M360 104 L360 120 M440 104 L440 120" stroke="#8F6510" stroke-width="2.5"/>
  <path d="M0 96 L480 96" stroke="#4A3728" stroke-width="4"/>
</g>
</svg>
