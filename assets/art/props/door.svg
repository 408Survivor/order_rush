<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
<!-- 店门（#51）：俯视——门框 + 敞开的门扇 + 门口地垫区，贴纸描边 -->
<g stroke="#4A3728" stroke-width="4" stroke-linejoin="round">
  <!-- 门框 -->
  <rect x="6" y="6" width="148" height="108" rx="8" fill="#B07D4E"/>
  <!-- 门洞（深色=通向店外） -->
  <rect x="22" y="20" width="116" height="80" rx="6" fill="#6B5B4A"/>
  <!-- 敞开的门扇（斜置） -->
  <path d="M30 24 L66 34 L66 92 L30 96 Z" fill="#E8C898"/>
  <circle cx="58" cy="64" r="4" fill="#D9A62E" stroke="none"/>
  <!-- 门洞高光 -->
  <path d="M76 30 L130 30" stroke="#8F7B66" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
