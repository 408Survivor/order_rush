<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 240" width="190" height="240">
<!-- 店外果树（#85）：190x240 贴纸风——三层绿树冠 + 橘子点缀 + 深咖啡 #4A3728 粗描边（同 plant/wall 惯例） -->
<!-- 地面阴影 -->
<ellipse cx="95" cy="224" rx="62" ry="12" fill="#4A3728" fill-opacity="0.15"/>
<!-- 树干 -->
<path d="M86 226 L88 160 Q95 150 102 160 L104 226 Q95 232 86 226 Z" fill="#8A5A3B" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
<path d="M90 176 Q95 170 100 176" fill="none" stroke="#6B4226" stroke-width="4" stroke-linecap="round"/>
<!-- 树冠后层（深绿） -->
<circle cx="95" cy="92" r="72" fill="#3E9E63" stroke="#4A3728" stroke-width="7"/>
<circle cx="44" cy="116" r="40" fill="#3E9E63" stroke="#4A3728" stroke-width="6"/>
<circle cx="146" cy="116" r="40" fill="#3E9E63" stroke="#4A3728" stroke-width="6"/>
<!-- 树冠中层 -->
<circle cx="95" cy="86" r="58" fill="#57B87E"/>
<circle cx="48" cy="112" r="30" fill="#57B87E"/>
<circle cx="142" cy="112" r="30" fill="#57B87E"/>
<!-- 树冠前层亮部（薄荷绿贴色板） -->
<circle cx="80" cy="70" r="34" fill="#6FCE96"/>
<circle cx="58" cy="102" r="18" fill="#6FCE96"/>
<!-- 奶油高光弧 -->
<path d="M52 60 Q70 34 102 34" fill="none" stroke="#FFF6E5" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>
<!-- 橘子（奶橙 + 细描边） -->
<g fill="#FFB26B" stroke="#4A3728" stroke-width="4">
<circle cx="118" cy="58" r="11"/>
<circle cx="66" cy="88" r="11"/>
<circle cx="132" cy="104" r="11"/>
<circle cx="92" cy="126" r="11"/>
<circle cx="42" cy="130" r="10"/>
<circle cx="152" cy="134" r="10"/>
</g>
<g fill="#FFF6E5">
<circle cx="114" cy="54" r="3.5"/>
<circle cx="62" cy="84" r="3.5"/>
<circle cx="128" cy="100" r="3.5"/>
<circle cx="88" cy="122" r="3.5"/>
</g>
</svg>
